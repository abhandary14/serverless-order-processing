AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Fault-tolerant serverless order processing pipeline (Order Intake -> SQS -> Order Processing -> SQS -> Notification),
  backed by DynamoDB, with a DLQ and CloudWatch observability. See PROJECT.md for architectural decisions.

Parameters:
  PaymentFailureRate:
    Type: String
    Default: "0"
    Description: >
      Probability (0.0-1.0) that the mock payment step in Order Processing simulates a
      failure. Defaults to 0 (never fails); overridden during chaos testing.

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Orders"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 3
        WriteCapacityUnits: 3
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: customer_email
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
        - IndexName: CustomerEmailCreatedAtIndex
          KeySchema:
            - AttributeName: customer_email
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Inventory"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 3
        WriteCapacityUnits: 3
      AttributeDefinitions:
        - AttributeName: item_id
          AttributeType: S
      KeySchema:
        - AttributeName: item_id
          KeyType: HASH

  OrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-orders-dlq"

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-orders-queue"
      # Well above tenacity's ~10s in-process retry window, so tenacity always finishes
      # before SQS could redeliver. See PROJECT.md's retry strategy section.
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
        # Total separate invocation attempts allowed (each already tenacity-hardened
        # in-process) before giving up and sending to the DLQ.
        maxReceiveCount: 3

  OrderIntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-order-intake"
      CodeUri: order_intake/
      Handler: app.lambda_handler
      Environment:
        Variables:
          ORDERS_TABLE_NAME: !Ref OrdersTable
          ORDERS_QUEUE_URL: !Ref OrdersQueue
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OrdersQueue.QueueName
      FunctionUrlConfig:
        AuthType: NONE

  OrderProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-order-processing"
      CodeUri: order_processing/
      Handler: app.lambda_handler
      Environment:
        Variables:
          ORDERS_TABLE_NAME: !Ref OrdersTable
          INVENTORY_TABLE_NAME: !Ref InventoryTable
          PAYMENT_FAILURE_RATE: !Ref PaymentFailureRate
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
        - DynamoDBWritePolicy:
            TableName: !Ref InventoryTable
      Events:
        OrdersQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt OrdersQueue.Arn
            BatchSize: 1

  DlqHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-dlq-handler"
      CodeUri: dlq_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          ORDERS_TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
      Events:
        OrdersDLQEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt OrdersDLQ.Arn
            BatchSize: 1

Outputs:
  OrderIntakeFunctionUrl:
    Description: Public HTTP endpoint for submitting orders (POST)
    Value: !GetAtt OrderIntakeFunctionUrl.FunctionUrl
  OrdersTableName:
    Description: Name of the Orders DynamoDB table
    Value: !Ref OrdersTable
  InventoryTableName:
    Description: Name of the Inventory DynamoDB table
    Value: !Ref InventoryTable
  OrdersQueueUrl:
    Description: URL of the SQS queue between Order Intake and Order Processing
    Value: !Ref OrdersQueue
  OrdersDLQUrl:
    Description: URL of the dead-letter queue for orders that exhausted all retries
    Value: !Ref OrdersDLQ
